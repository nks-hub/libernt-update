server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # The feed changes with every release; objects and manifests never change once published.
    location ~ ^/feed(-v2)?\.json(\.sig)?$ { add_header Cache-Control "no-cache"; }
    location /objects/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /releases/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    gzip on;
    gzip_types application/json text/plain;
    types { application/json json; text/plain sig; }
    default_type application/octet-stream;
}
